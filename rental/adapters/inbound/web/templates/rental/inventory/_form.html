<form id="register-equipment" method="post" action="{% url 'inventory' %}"
      hx-post="{% url 'inventory' %}" hx-target="this" hx-swap="outerHTML">
  {% csrf_token %}
  {% if registered %}
    <p><ins>Equipment registered.</ins></p>
  {% endif %}
  {% include "rental/_fields.html" %}
  <button type="submit">Add equipment</button>
</form>
