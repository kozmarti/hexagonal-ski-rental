<form id="register-equipment" method="post" action="{% url 'inventory' %}"
      hx-post="{% url 'inventory' %}" hx-target="this" hx-swap="outerHTML">
  {% csrf_token %}
  {% if registered %}
    <p><ins>Equipment registered.</ins></p>
  {% endif %}
  {% for error in form.non_field_errors %}
    <p><del>{{ error }}</del></p>
  {% endfor %}

  <div class="grid">
    {% for field in form %}
      <label>
        {{ field.label }}
        {{ field }}
        {% if field.errors %}
          <small>{{ field.errors|join:" " }}</small>
        {% elif field.help_text %}
          <small>{{ field.help_text }}</small>
        {% endif %}
      </label>
    {% endfor %}
  </div>
  <button type="submit">Add equipment</button>
</form>
