<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ski Rental{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% with page=request.resolver_match.url_name %}
  <header class="container">
    <nav>
      <ul>
        <li><a href="{% url 'home' %}" class="contrast"><strong>Ski Rental</strong></a></li>
      </ul>
      <ul>
        <li><a href="{% url 'rentals' %}" {% if page == 'rentals' or page == 'rental-new' or page == 'rental-equipment' %}aria-current="page"{% endif %}>Rentals</a></li>
        <li><a href="{% url 'inventory' %}" {% if page == 'inventory' %}aria-current="page"{% endif %}>Inventory</a></li>
        <li><a href="{% url 'maintenance' %}" {% if page == 'maintenance' %}aria-current="page"{% endif %}>Maintenance</a></li>
      </ul>
    </nav>
  </header>
  {% endwith %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
