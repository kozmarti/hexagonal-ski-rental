name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: ski_rental
          POSTGRES_USER: ski_rental
          POSTGRES_PASSWORD: ski_rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ski_rental -d ski_rental"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-insecure-key
      POSTGRES_DB: ski_rental
      POSTGRES_USER: ski_rental
      POSTGRES_PASSWORD: ski_rental
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      MONGO_URL: mongodb://localhost:27017/?directConnection=true

    steps:
      - uses: actions/checkout@v4

      # MongoDB as a single-node replica set (needed for transactions). Started by hand:
      # service containers cannot pass the --replSet option.
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 30); do
            docker exec mongo mongosh --quiet --eval \
              "try { rs.status() } catch (e) { rs.initiate() } if (!db.hello().isWritablePrimary) { quit(1) }" \
              && break
            sleep 2
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Architecture rules (import-linter)
        run: lint-imports

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      # The settings the hosted demo runs with (DEBUG off): HTTPS, secure cookies, HSTS...
      - name: Production settings (check --deploy)
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-deploy-check-${{ github.run_id }}-0123456789abcdefghijklmnopqrstuvwxyz

      - name: Tests (pytest)
        run: pytest
