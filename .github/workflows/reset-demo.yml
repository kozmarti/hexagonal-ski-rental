name: Reset demo

# The hosted demo has no login (staff authentication is out of scope), so anyone can change
# its data. Every night it goes back to the demo data: the database is emptied, then filled
# again by seed_demo, through the use cases, like the counter would.
# Render's free plan has no cron jobs, so GitHub runs it, connected to the Neon database.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC: 4 a.m. in the French Alps in winter
  workflow_dispatch: # "Run workflow" button: the first fill, or a reset by hand

# Never two resets at once.
concurrency: reset-demo

jobs:
  reset:
    runs-on: ubuntu-latest
    # Only in this repository: a fork has no demo database.
    if: github.repository == 'kozmarti/hexagonal-ski-rental'

    env:
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
      DJANGO_SECRET_KEY: reset-job-only # no request is served here: nothing is signed with it
      REPOSITORY_BACKEND: orm
      NOTIFIERS: logging

    steps:
      - name: Demo database configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DEMO_DATABASE_URL is missing (Neon's connection string)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The demo may run an older version for a few minutes after a merge: same migrations
      # as the app, so the schema matches the code being seeded.
      - name: Migrations
        run: python manage.py migrate --no-input

      - name: Empty the database
        run: python manage.py flush --no-input

      - name: Demo data
        run: python manage.py seed_demo
